<script type="text/x-dc" data-dc-script data-props='{"crop":{"editor":"enum","options":["full","bust"],"default":"full"},"w":{"editor":"int","default":200,"min":40,"max":800},"$preview":{"width":200,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const w = Number(p.w ?? 200);
    const VB = { full: [0, 0, 200, 420], bust: [10, 80, 180, 256] };
    const v = VB[p.crop ?? "full"] || VB.full;
    return { vb: v.join(" "), pw: w, ph: Math.round((w * v[3]) / v[2]) };
  }
}
