<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La scène</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 14px; background: #f1ece1; color: #14110d; font-family: 'Instrument Sans', system-ui, sans-serif; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6f6857">
<span>Feuilleton · Épisode 1</span>
<span>Planche 7 sur 8</span>
</div>
<div style="position: relative; height: 420px; flex-shrink: 0; border-radius: 22px; overflow: hidden; background: #14285f">
<img src="/_blob/1d775a1d15fc8c01a36d04c67b2f008d" alt="Le Mistral, le zinc" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 28% 50%">
<button type="button" aria-label="Marin" style="position: absolute; right: {{nOff}}px; bottom: 0; display: block; margin: 0; padding: 0; border: 0; background: transparent; line-height: 0">
<sc-if value="{{flat}}" hint-placeholder-val="{{true}}">
<dc-import name="Marin" look="{{look}}" mood="{{nMood}}" blink="{{nBlink}}" crop="bust" w="206" hint-size="206px,348px"></dc-import>
</sc-if>
<sc-if value="{{rond}}" hint-placeholder-val="{{false}}">
<dc-import name="MarinRond" mood="{{nMood}}" blink="{{nBlink}}" crop="bust" w="236" hint-size="236px,336px"></dc-import>
</sc-if>
</button>
<button type="button" aria-label="Écouter Margaux" onClick="{{tapMargaux}}" style="position: absolute; left: {{mOff}}px; bottom: 0; display: block; margin: 0; padding: 0; border: 0; background: transparent; line-height: 0; cursor: pointer">
<sc-if value="{{flat}}" hint-placeholder-val="{{true}}">
<dc-import name="Margaux" look="{{look}}" mood="{{mMood}}" mouth="{{mMouth}}" blink="{{mBlink}}" hold="cle" crop="bust" w="196" hint-size="196px,331px"></dc-import>
</sc-if>
<sc-if value="{{rond}}" hint-placeholder-val="{{false}}">
<dc-import name="MargauxRond" mood="{{mMood}}" mouth="{{mMouth}}" blink="{{mBlink}}" hold="cle" crop="bust" w="230" hint-size="230px,327px"></dc-import>
</sc-if>
</button>
<button type="button" aria-label="Écouter Margaux" onClick="{{tapMargaux}}" style="position: absolute; left: 14px; top: 14px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; border: 0; border-radius: 999px; background: #14110d; box-shadow: 0 4px 0 #000000; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="stroke: #f8f3e8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>
</button>
<sc-if value="{{picked}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: 16px; right: 16px; max-width: 220px; padding: 10px 14px; border-radius: 16px; background: #14110d; color: #f8f3e8; font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 18px; line-height: 1.3">{{youText}}</div>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-height: 66px">
<div style="font-size: 12px; color: #6f6857">Margaux</div>
<div style="font-family: 'EB Garamond', Georgia, serif; font-size: 22px; line-height: 1.25">«&#8239;{{lineText}}&#8239;»</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{choices}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" style="width: 100%; text-align: left; padding: 11px 16px; border: 0; border-radius: 16px; font-family: 'EB Garamond', Georgia, serif; font-size: 19px; line-height: 1.25; cursor: pointer; color: {{c.fg}}; background: {{c.bg}}; box-shadow: 0 3px 0 {{c.edge}}">{{c.text}}</button>
</sc-for>
</div>
<sc-if value="{{picked}}" hint-placeholder-val="{{false}}">
<button type="button" style="height: 52px; flex-shrink: 0; border: 0; border-radius: 16px; background: #d8321a; color: #ffffff; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 17px; font-weight: 600; box-shadow: 0 5px 0 #9c2411; cursor: pointer">Suite</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["affiche","ligne","rond"],"default":"rond"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...a) {
    super(...a);
    this.state = { key: "L1", talking: false, step: 0, choice: null, blinkM: false, blinkN: false };
  }
  componentDidMount() {
    this.bm = setInterval(() => {
      this.setState({ blinkM: true });
      setTimeout(() => this.setState({ blinkM: false }), 140);
    }, 3300);
    this.bn = setInterval(() => {
      this.setState({ blinkN: true });
      setTimeout(() => this.setState({ blinkN: false }), 140);
    }, 4300);
  }
  componentWillUnmount() {
    clearInterval(this.bm);
    clearInterval(this.bn);
    clearInterval(this.tk);
    clearTimeout(this.nx);
  }
  lines() {
    return {
      L1: { text: "Elle ne donnait jamais cette clé.", seq: ["e", "rest", "e", "rest", "o", "e", "rest", "a", "m", "e", "rest", "e", "rest", "e", "rest"] },
      L2: { text: "Tu vas monter ?", seq: ["rest", "o", "f", "a", "m", "o", "rest", "e", "rest"] },
      R1: { text: "Pas ce soir.", seq: ["m", "a", "rest", "e", "rest", "o", "a", "rest"] },
      R2: { text: "C'est bien. Attends un peu.", seq: ["rest", "e", "m", "e", "rest", "a", "rest", "o", "rest", "m", "o", "rest"] },
      R3: { text: "Moi aussi. Demain, alors.", seq: ["m", "o", "a", "o", "rest", "e", "rest", "e", "m", "e", "a", "rest", "o", "rest"] },
    };
  }
  play(key, then) {
    clearInterval(this.tk);
    clearTimeout(this.nx);
    const seq = this.lines()[key].seq;
    let i = 0;
    this.setState({ key: key, talking: true, step: 0 });
    this.tk = setInterval(() => {
      i += 1;
      if (i >= seq.length) {
        clearInterval(this.tk);
        this.setState({ talking: false, step: 0 });
        if (then) this.nx = setTimeout(then, 650);
      } else {
        this.setState({ step: i });
      }
    }, 115);
  }
  renderVals() {
    const look = this.props.look ?? "rond";
    const s = this.state;
    const L = this.lines();
    const line = L[s.key] || L.L1;
    const react = { R1: { m: "fachee", n: "surprise" }, R2: { m: "emue", n: "ravie" }, R3: { m: "emue", n: "emue" } };
    const r = s.choice ? react[s.choice] : null;
    const opts = [
      { id: "R1", text: "Oui. Ce soir." },
      { id: "R2", text: "Je ne sais pas." },
      { id: "R3", text: "Monter… demain ? J'ai peur un peu." },
    ];
    const chosen = opts.find((o) => o.id === s.choice);
    const choices = opts.map((o) => {
      const on = s.choice === o.id;
      const off = !!s.choice && !on;
      return {
        id: o.id,
        text: o.text,
        bg: on ? "#14110d" : "#f8f3e8",
        fg: on ? "#f8f3e8" : off ? "#6f6857" : "#14110d",
        edge: on ? "#000000" : "#e8e0cf",
        pick: () => {
          if (this.state.choice) return;
          this.setState({ choice: o.id });
          this.nx = setTimeout(() => this.play(o.id), 600);
        },
      };
    });
    return {
      look,
      mOff: look === "rond" ? -30 : -12,
      nOff: look === "rond" ? -34 : -18,
      flat: look !== "rond",
      rond: look === "rond",
      mMood: r ? r.m : "neutre",
      nMood: r ? r.n : "surprise",
      mMouth: s.talking ? line.seq[s.step] : "auto",
      mBlink: s.blinkM && !s.talking,
      nBlink: s.blinkN,
      lineText: line.text,
      choices,
      picked: !!s.choice,
      youText: chosen ? chosen.text : "",
      tapMargaux: () => {
        if (this.state.talking) return;
        if (this.state.choice) {
          this.play(this.state.choice);
          return;
        }
        this.play("L1", () => this.play("L2"));
      },
    };
  }
}
</script>
</body>
</html>
