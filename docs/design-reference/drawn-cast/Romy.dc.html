<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["neutre","ravie","surprise","fachee","emue"],"default":"neutre"},"mouth":{"editor":"enum","options":["auto","rest","a","o","e","m","f"],"default":"auto"},"crop":{"editor":"enum","options":["full","bust","head"],"default":"full"},"w":{"editor":"int","default":200,"min":40,"max":800},"blink":{"editor":"boolean","default":false},"$preview":{"width":200,"height":420}}'>
class Component extends DCLogic {
  reye(c, f) {
    const cx = c[0];
    const cy = c[1];
    const ell = (x, y, rx, ry) => `M${x - rx},${y} A${rx},${ry} 0 1 0 ${x + rx},${y} A${rx},${ry} 0 1 0 ${x - rx},${y} Z`;
    const rx = f.rx;
    const ry = f.ry;
    const hw = rx + 3.5;
    const top = cy - ry - 5;
    const left = f.side < 0;
    const o = { sD: "inline", sclera: ell(cx, cy, rx, ry), iris: "", pupil: "", glint: "", lid: "", lidLine: "", arc: "", tear: "" };
    let px = cx + (f.dx || 0);
    let py = cy + (f.dy || 0) + 1;
    let r = f.pr;
    const lidAt = (yl, yr, bow) => {
      const mid = (yl + yr) / 2 - bow;
      o.lid = `M${cx - hw},${top} L${cx + hw},${top} L${cx + hw},${yr} Q${cx},${mid} ${cx - hw},${yl} Z`;
      const k = 3.5 / (2 * hw);
      o.lidLine = `M${cx - rx},${yl + (yr - yl) * k} Q${cx},${mid} ${cx + rx},${yr - (yr - yl) * k}`;
    };
    const s = f.state;
    if (s === "wide") { o.sclera = ell(cx, cy - 1, rx + 1, ry + 1.5); r = r - 1; py = cy; }
    if (s === "wry") lidAt(cy - ry * 0.28, cy - ry * 0.28, ry * 0.18);
    if (s === "cross") lidAt(left ? cy - ry * 0.62 : cy + ry * 0.08, left ? cy + ry * 0.08 : cy - ry * 0.62, 0);
    if (s === "sad") {
      lidAt(left ? cy - ry * 0.08 : cy - ry * 0.66, left ? cy - ry * 0.66 : cy - ry * 0.08, 0);
      py = cy + 3;
      if (left) o.tear = `M${cx - rx * 0.85},${cy + ry * 0.7} c3,5 3,8 0,8 c-3,0 -3,-3 0,-8 Z`;
    }
    if (s === "happy") { o.sD = "none"; o.arc = `M${cx - rx},${cy + 3} Q${cx},${cy - ry * 0.75} ${cx + rx},${cy + 3}`; }
    if (s === "shut") { o.sD = "none"; o.arc = `M${cx - rx},${cy + 1} Q${cx},${cy + ry * 0.5} ${cx + rx},${cy + 1}`; }
    o.iris = ell(px, py, r, r);
    o.pupil = ell(px, py, r * 0.48, r * 0.48);
    o.glint = ell(px + r * 0.4, py - r * 0.4, r * 0.3, r * 0.3);
    return o;
  }
  mouth(key) {
    const M = {
      smirk: ["M-6,15 Q1,17.5 9,12.5 Q2,19.5 -6,15 Z"],
      smile: ["M-6,14.5 Q2,19 10,14 Q2,21.5 -6,14.5 Z"],
      soft: ["M-5,15 Q2,18 9,15 Q2,20 -5,15 Z"],
      grin: ["M-8,13 Q2,15.5 12,13 Q10,23 2,23 Q-6,23 -8,13 Z", "M-6.6,13.5 Q2,15.8 10.6,13.5 L10.2,15.6 Q2,17.6 -6.2,15.8 Z", "M-2,20.6 Q2,18.2 6,20.6 Q4,23 2,23 Q0,23 -2,20.6 Z"],
      frown: ["M-6,17.5 Q2,13.5 10,17.5 Q2,16 -6,17.5 Z"],
      o: ["M-1.2,16.5 A3.2,4.2 0 1 0 5.2,16.5 A3.2,4.2 0 1 0 -1.2,16.5 Z", "", "M0,18.6 Q2,17.4 4,18.6 Q3.2,20.4 2,20.5 Q0.8,20.4 0,18.6 Z"],
      rest: ["M-6,15.5 Q2,17 10,15.5 Q2,18.6 -6,15.5 Z"],
      a: ["M-6,13.5 Q2,12 10,13.5 Q8.5,22.5 2,22.5 Q-4.5,22.5 -6,13.5 Z", "M-5,13.6 Q2,12.4 9,13.6 L8.8,15 Q2,14.2 -4.8,15 Z", "M-2.5,20 Q2,18 6.5,20 Q5,22.3 2,22.4 Q-1,22.3 -2.5,20 Z"],
      e: ["M-7.5,14 Q2,12.5 11.5,14 Q9.5,18.5 2,18.5 Q-5.5,18.5 -7.5,14 Z", "M-6.5,14 Q2,12.9 10.5,14 L10.2,15.4 Q2,14.8 -6.2,15.4 Z"],
      m: ["M-6,15 Q2,14.2 10,15 L10,16.4 Q2,17 -6,16.4 Z"],
      f: ["M-6,14 Q2,13 10,14 L10,15.8 Q2,16.4 -6,15.8 Z", "M-5.4,14 Q2,13.3 9.4,14 L9.4,15.2 Q2,15.4 -5.4,15.2 Z"],
    };
    const m = M[key] || M.rest;
    return { d: m[0], teeth: m[1] || "", tongue: m[2] || "", open: !!m[1] || key === "o" };
  }
  renderVals() {
    const p = this.props;
    const mood = p.mood ?? "neutre";
    const crop = p.crop ?? "full";
    const w = Number(p.w ?? 200);
    const blink = p.blink === true || p.blink === "true";
    const VB = { full: [0, 0, 200, 420], bust: [10, 58, 180, 256], head: [28, 60, 144, 144] };
    const v = VB[crop] || VB.full;
    const tilt = { neutre: 0, ravie: -3, surprise: 0, fachee: 0, emue: 3 }[mood] ?? 0;
    const EYES = { neutre: ["open", "open"], ravie: ["happy", "happy"], surprise: ["wide", "wide"], fachee: ["cross", "cross"], emue: ["sad", "sad"] };
    const st = blink ? ["shut", "shut"] : EYES[mood] || EYES.neutre;
    const BR = {
      neutre: [[-24, -21, -15, -26, -6, -22], [6, -22, 15, -26, 24, -21]],
      ravie: [[-24, -24, -15, -29, -6, -25], [6, -25, 15, -29, 24, -24]],
      surprise: [[-24, -28, -15, -34, -6, -29], [6, -29, 15, -34, 24, -28]],
      fachee: [[-24, -24, -15, -22, -6, -16], [6, -16, 15, -22, 24, -24]],
      emue: [[-24, -18, -15, -21, -6, -25], [6, -25, 15, -21, 24, -18]],
    };
    const br = BR[mood] || BR.neutre;
    const curve = (b) => `M${b[0]},${b[1]} Q${b[2]},${b[3]} ${b[4]},${b[5]}`;
    const ell = (x, y, rx, ry) => `M${x - rx},${y} A${rx},${ry} 0 1 0 ${x + rx},${y} A${rx},${ry} 0 1 0 ${x - rx},${y} Z`;
    const fr = [[-22, 7], [-26, 10], [-18, 10], [-12, 5], [-8, 9], [-3, 4], [22, 7], [26, 10], [18, 10], [12, 5], [8, 9], [3, 4]];
    const key = p.mouth && p.mouth !== "auto" ? p.mouth : { neutre: "smile", ravie: "grin", surprise: "o", fachee: "frown", emue: "soft" }[mood] || "smile";
    const m = this.mouth(key);
    const eye = { rx: 10, ry: 11.5, pr: 6.2, dx: 0 };
    const EL = [-15, -4];
    const ER = [15, -4];
    const lash = (c, side) => `M${c[0] - 10.5},${c[1] - 3} Q${c[0]},${c[1] - 15} ${c[0] + 10.5},${c[1] - 3} M${c[0] + side * 10},${c[1] - 4} L${c[0] + side * 14},${c[1] - 6.5}`;
    return {
      vb: v.join(" "),
      pw: w,
      ph: Math.round((w * v[3]) / v[2]),
      headT: `translate(100 150) rotate(${tilt})`,
      freckles: fr.map((f) => ell(f[0], f[1], 1.1, 1.1)).join(" "),
      eL: this.reye(EL, { ...eye, state: st[0], side: -1 }),
      eR: this.reye(ER, { ...eye, state: st[1], side: 1 }),
      lashL: st[0] === "open" || st[0] === "wide" ? lash(EL, -1) : "",
      lashR: st[1] === "open" || st[1] === "wide" ? lash(ER, 1) : "",
      browL: curve(br[0]),
      browR: curve(br[1]),
      mouthD: m.d,
      mouthFill: m.open ? "#14110d" : "#b84a3c",
      teethD: m.teeth,
      tongueD: m.tongue,
    };
  }
}
</script>
