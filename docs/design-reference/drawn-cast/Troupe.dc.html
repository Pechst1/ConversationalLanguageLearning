<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La troupe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1720px; height: 470px; box-sizing: border-box; padding: 28px 40px; display: flex; flex-direction: column; gap: 10px; background: #f1ece1; color: #14110d; font-family: 'Instrument Sans', system-ui, sans-serif">
<h2 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-weight: 400; font-size: 34px; line-height: 1.1">La troupe du Mistral</h2>
<div style="display: flex; gap: 14px; align-items: flex-end">
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="MargauxRond" mood="{{mood}}" hold="verre" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">Margaux</div></div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="Lila" mood="{{mood}}" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">Lila</div></div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="Gus" mood="{{mood}}" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">Gus</div></div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="MarinRond" mood="{{mood}}" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">Marin</div></div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="Romy" mood="{{mood}}" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">Romy</div></div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="Marchand" mood="{{mood}}" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">M. Marchand</div></div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="Camille" variant="f" mood="{{mood}}" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">Camille (f)</div></div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="Camille" variant="m" mood="{{mood}}" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">Camille (m)</div></div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="Odile" mood="{{mood}}" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">Odile</div></div>
<div style="width: 150px; display: flex; flex-direction: column; gap: 6px"><dc-import name="Toi" w="150" hint-size="150px,315px"></dc-import><div style="font-size: 13px; text-align: center">Toi, de dos</div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["neutre","ravie","surprise","fachee","emue"],"default":"neutre"},"$preview":{"width":1720,"height":470}}'>
class Component extends DCLogic {
  renderVals() {
    return { mood: this.props.mood ?? "neutre" };
  }
}
</script>
</body>
</html>
