name: Browser walk

# E-3. A scripted 7-day walk in a real browser (375x812, light/dark, en/de/fr) against a
# throwaway database and the fake story provider — no paid call. The screenshots and a
# contact sheet are attached as an artifact; a nightly run keeps the last 7 walks.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

# Called from CI, this walk is one of the checks Render waits for before it deploys a
# commit on main, so it is never cancelled there; the event name keeps the nightly
# schedule and CI's call in separate groups so one cannot cancel the other.
concurrency:
  group: walk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scope:
    # Which walk this run plays (web-frontend/e2e/lib/walk-scope.mjs, tested by
    # walk-scope.test.mjs). Main, the nightly run and a manual run play four shards at
    # full length: en + B1, de, fr, season. A pull request plays them too when it
    # changes the walk or what it walks through (e2e, the journey client, atelier.tsx,
    # daily_journey, living_story, the season, the judge, this file): on 10-11 Nov main
    # went red five times in a row on walks only main played. Any other pull request
    # plays the one short shard, en + B1 for 3 days (day 1, the Feuilleton entry and La
    # Forge on day 2, the last-day drill and settings checks on day 3).
    name: Walk · scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's checkout is its merge commit: HEAD^1 is the base branch,
          # so `HEAD^1 HEAD` is what merging would change.
          fetch-depth: 2
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          matrix=$(node web-frontend/e2e/lib/walk-scope.mjs "${{ github.event_name }}" < "$RUNNER_TEMP/changed.txt")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "### Browser walk scope" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$matrix\`" >> "$GITHUB_STEP_SUMMARY"

  walk:
    # One runner played all five learners side by side for 18 minutes, the long pole of
    # every CI run: the next-slowest job ends by minute 7. Four runners now each start
    # their own stack and play a share of the same learners, days and checks (two
    # full 7-day learners on one runner still took 15 minutes). en and B1 share a
    # stack, so the engine's writer still sees concurrent requests; the postgres
    # job in ci.yml tests the row locks directly. `needs:` waits for every shard.
    #
    # The job names come from the matrix and stay as they were: «Walk · en + B1 × 7
    # days» … «Walk · season × 10 days» on main and on a full pull-request walk,
    # «Walk · en + B1 × 3 days» on a short one.
    needs: scope
    name: Walk · ${{ matrix.shard }} × ${{ matrix.days }} days
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix).include }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # The harness creates and drops its own atelier_walk_<timestamp> database here.
      WALK_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      WALK_PYTHON: python
      SECRET_KEY: ci-secret-key
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          # Editable (-e): `app` must be the checkout under test. A plain install
          # puts a wheel in site-packages without the package data (the season
          # world, prompts, word lists), and every `python scripts/…` imports
          # that copy, not this one.
          pip install -c constraints.txt -e .[dev]
          python -m spacy download fr_core_news_sm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install frontend and the browser
        working-directory: web-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Walk
        id: walk
        working-directory: web-frontend
        run: npm run walk -- ${{ matrix.args }} ${{ matrix.pr_args }} --out e2e/out/ci

      # #282: one La Forge miss at 375x812 in a real browser (a fixture page, no database): the
      # prompt is not covered by a cameo, «Compare» is above the verdict sheet, the field holds
      # the words the instruction names. Once, not once per shard: every run has en + B1.
      - name: Miss layout
        if: always() && matrix.key == 'en-b1'
        working-directory: web-frontend
        run: npm run walk:miss -- --out e2e/out/ci/miss-layout

      - name: Summary
        if: always()
        working-directory: web-frontend
        run: |
          python - <<'PY'
          import json, os
          path = "e2e/out/ci/report.json"
          if not os.path.exists(path):
              raise SystemExit("no walk report")
          d = json.load(open(path))
          lines = [f"### Browser walk · ${{ matrix.shard }}\n", f"{d['meta']}\n", f"{d['shots']} screens; {len(d['failures'])} failed assertions\n"]
          for row in d["summary"]:
              known = f", {row['known']} known" if row.get("known") else ""
              lines.append(f"- {'FAIL' if row['fail'] else 'ok'} `{row['id']}`: {row['pass']} pass, {row['fail']} fail{known}")
          for row in d.get("known", []):
              lines.append(f"- known #{row['known']} `{row['id']}`: {row['detail'][:200]}")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          PY

      - name: Upload screenshots and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}-${{ github.run_number }}-${{ matrix.key }}
          path: web-frontend/e2e/out/ci
          # A nightly walk is kept for 7 days = the last 7 walks (four artifacts each).
          retention-days: ${{ github.event_name == 'schedule' && 7 || 14 }}
          if-no-files-found: warn
