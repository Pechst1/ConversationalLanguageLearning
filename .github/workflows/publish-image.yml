name: Publish container image

# Builds the backend image the deploy compose files pull
# (ghcr.io/pechst1/conversational-language-learning:sha-<full-commit>).
# Called only after every check of a commit passes: from CI for a tag, and from
# walk-main.yml for a commit on main once its CI run and its walks have passed.
# Uses the built-in GITHUB_TOKEN, so no extra secrets are required.

on:
  workflow_call:
    inputs:
      ref:
        # walk-main.yml: the main commit whose CI run and walks passed (the run itself
        # is on main's tip, which may have moved on). Empty: the caller's own commit.
        description: Commit to build and tag
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pechst1/conversational-language-learning
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ inputs.ref || github.sha }}
            type=ref,event=tag

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
