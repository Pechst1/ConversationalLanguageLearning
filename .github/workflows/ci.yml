name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-walk:
    name: Browser release checks
    uses: ./.github/workflows/walk.yml

  publish:
    name: Publish verified image
    needs: [generated-types, backend, learner-walk, postgres, frontend, docker, browser-walk]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml

  generated-types:
    name: OpenAPI · generated types are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: pip install -c constraints.txt -e .
      - run: npm ci
        working-directory: web-frontend
      - name: Reject stale generated types
        run: npm run types:check
        working-directory: web-frontend

  backend:
    # The suite outgrew one 2-core runner (cancelled at 30 minutes, 80 % done):
    # four shards, dealt by scripts/ci_test_shard.py. `needs: backend` waits
    # for all of them.
    name: Backend · ruff + pytest (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      # The suite itself runs on an in-memory SQLite engine (tests/conftest.py);
      # these stay so that nothing that reaches for the configured URLs finds a
      # closed port instead of a server.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atelier_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/atelier_ci
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable (-e): `app` must be the checkout under test. A plain install
          # puts a wheel in site-packages without the package data (the season
          # world, prompts, word lists), and every `python scripts/…` imports
          # that copy, not this one.
          pip install -c constraints.txt -e .[dev]
          python -m spacy download fr_core_news_sm

      - name: Check Python with Ruff
        if: matrix.shard == 1
        run: ruff check .

      - name: Run backend tests
        # `-n auto --dist loadfile`: every xdist worker is its own process with its
        # own in-memory SQLite database, and a test file never leaves its worker,
        # so module fixtures (the 126-day harness) are built once. Each test's and
        # each module's data is rolled back when it ends (tests/conftest.py,
        # SavepointLedger), so the order is shuffled (pytest-randomly) with a seed
        # named here: a red run replays with `-p randomly --randomly-seed=<run id>`.
        # No coverage on the gate: it doubled the run (30 min, cancelled at 80 %)
        # and had no threshold. `-q` (a single one — pyproject no longer adds
        # another) keeps the final "N passed, M failed" line.
        run: >-
          pytest -q -n auto --dist loadfile
          -p randomly --randomly-seed=${{ github.run_id }}
          --durations=15
          --junitxml=pytest-report.xml
          $(python scripts/ci_test_shard.py ${{ matrix.shard }} 4)

      - name: Test count
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("pytest-report.xml"):
              raise SystemExit("no pytest report (the run did not start)")
          suite = ET.parse("pytest-report.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          tests, failures, errors, skipped = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          passed = tests - failures - errors - skipped
          line = f"pytest: {passed} passed, {failures} failed, {errors} errors, {skipped} skipped (of {tests})"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### Backend shard ${{ matrix.shard }}/4\n\n{line}\n")
          PY

  learner-walk:
    name: Backend · learner walk (30 days × 5 personas)
    # EXERCISE-QA 2026-10-03: the long tier of tests/test_learner_walk.py, which the
    # default run skips. Same environment as the backend job (in-memory SQLite).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/atelier_ci
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-secret-key
      WALK_TRANSCRIPTS: /tmp/learner-walk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable (-e): `app` must be the checkout under test. A plain install
          # puts a wheel in site-packages without the package data (the season
          # world, prompts, word lists), and every `python scripts/…` imports
          # that copy, not this one.
          pip install -c constraints.txt -e .[dev]
          python -m spacy download fr_core_news_sm

      - name: Run the long learner walk
        run: pytest -q -p no:cacheprovider -m walk tests/test_learner_walk.py

      - name: Walk transcripts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: learner-walk-transcripts
          path: /tmp/learner-walk
          if-no-files-found: ignore

  postgres:
    name: PostgreSQL · migrations + row locks
    # SQLite serialises every writer, so the row-lock paths (the story writer's
    # FOR UPDATE, the journey finish race, the drain) only mean something here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Not `language_learning`: the drivers below refuse that name, which
          # is the owner's live database on a developer machine.
          POSTGRES_DB: atelier_ci_pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/atelier_ci_pg
      PG_URL: postgresql://postgres:postgres@localhost:5432/atelier_ci_pg
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-secret-key
      # The drivers exercise the story-engine day. WP-75's authored first day
      # (the production default) has no engine scene, so day 1 would prove
      # nothing about the writer's locks.
      ATELIER_JOURNEY_FIRST_DAY_AUTHORED_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable (-e): `app` must be the checkout under test. A plain install
          # puts a wheel in site-packages without the package data (the season
          # world, prompts, word lists), and every `python scripts/…` imports
          # that copy, not this one.
          pip install -c constraints.txt -e .[dev]
          python -m spacy download fr_core_news_sm

      - name: Verify Alembic migrations
        # Also the step that gives the database its schema for everything below.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Audit Atelier word banks
        run: python scripts/audit_atelier_word_banks.py --output /tmp/atelier-word-bank-audit.json

      - name: PostgreSQL-only tests
        # Opt-in tests that skip on SQLite: WP-69's savepoint on a real aborted
        # transaction, and WP-18's health queries against the real schema.
        env:
          WP69_PG_URL: ${{ env.DATABASE_URL }}
          WP18_HEALTH_DATABASE_URL: ${{ env.DATABASE_URL }}
          PRODUCTION_READINESS_PG_URL: ${{ env.DATABASE_URL }}
          WP138_PG_URL: ${{ env.DATABASE_URL }}
        run: >-
          pytest -q -p no:cacheprovider
          tests/test_wp138_catalog_seeding_race.py::test_eight_concurrent_first_requests_seed_one_catalogue_on_real_postgres
          tests/test_wp69_never_lose_a_day.py::test_best_effort_on_real_postgres
          tests/test_grammar_catalog_seed_race.py
          tests/test_rollout_scripts.py::test_every_query_executes_against_a_real_database
          tests/test_production_auth_pg.py
          tests/test_production_recovery_pg.py

      - name: Story-engine row locks under concurrent requests
        run: |
          python scripts/dev_story_engine_server.py --port 8021 > /tmp/story-engine-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8021/health >/dev/null && break
            sleep 1
          done
          python scripts/verify_story_engine_pg.py --base-url http://127.0.0.1:8021 --database-url "$PG_URL"

      - name: Journey drain (flag off never strands a learner)
        run: python scripts/verify_journey_drain.py --database-url "$PG_URL" --port 8022 --log /tmp/journey-drain.log

      - name: Server logs
        if: failure()
        run: tail -n 200 /tmp/story-engine-server.log /tmp/journey-drain.log || true

  frontend:
    name: Frontend · types, lint, node tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: `scripts/capture-mobile-states.mjs` drives Chrome over
          # the DevTools Protocol with the global `WebSocket`, which Node 20
          # does not define (the mobile smoke died on `ReferenceError:
          # WebSocket is not defined`). `npm test` also relies on 22's glob
          # support in `node --test`. It is the version the project is
          # developed against.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web-frontend
        run: npm ci

      # `npm test` includes scripts/generated-api-types.test.mjs, which exports the
      # OpenAPI schema from the real app (`python scripts/export_openapi.py`). Without
      # the backend installed it died on `No module named 'fastapi'`.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install the backend (for the OpenAPI export)
        run: pip install -c constraints.txt -e .

      - name: Check frontend
        working-directory: web-frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com/api/v1
          # CI has no deployable host; the guard in native-api-env.mjs would
          # (correctly) reject the placeholder and turn this step permanently red.
          ALLOW_PLACEHOLDER_NATIVE_API: "true"
        run: |
          npx tsc --noEmit -p .
          npm run lint
          # Every *.test.js / *.test.mjs under lib, components and scripts —
          # a new suite is picked up without editing this file.
          npm test
          npm run build
          npm run build:native

      - name: Mobile viewport smoke
        working-directory: web-frontend
        env:
          CAPTURE_FRAMES: mobile-primitives-static
          CAPTURE_SKIP_AUTH: 'true'
          CAPTURE_VIEWPORTS: 390x844:compact,440x956:wide
          CAPTURE_DIR: /tmp/mobile-visual-checks
          CHROME_PATH: google-chrome
          FRONTEND_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/atelier-next.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/mobile-visual-qa >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/mobile-visual-qa >/dev/null
          npm run capture:mobile

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build . -t conversational-language-learning:ci
