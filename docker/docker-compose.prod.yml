services:
  api:
    image: ${APP_IMAGE:?Set APP_IMAGE to a tested sha tag or image digest}
    env_file:
      - ../.env.prod
    environment:
      RUN_MIGRATIONS: "1"
      BOOTSTRAP_REFERENCE_DATA: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Loopback only: the TLS proxy on the host (Caddy) is the one public door.
    # Published on every interface, a client could reach the API around the
    # proxy and forge the X-Forwarded-For hop RATE_LIMIT_TRUSTED_PROXY_HOPS=1 trusts.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Required: Serial/Feuilleton episode + image generation, nightly analytics,
  # notifications. -B embeds the beat scheduler (fine at single-worker scale;
  # split beat into its own service before scaling workers past 1).
  worker:
    image: ${APP_IMAGE:?Set APP_IMAGE to a tested sha tag or image digest}
    command: ["celery", "-A", "app.celery_app", "worker", "-B", "--loglevel=info"]
    env_file:
      - ../.env.prod
    environment:
      RUN_MIGRATIONS: "0"
      BOOTSTRAP_REFERENCE_DATA: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:15
    env_file:
      - ../.env.prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: language_learning
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1000 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
